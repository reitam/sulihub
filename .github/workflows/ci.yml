name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # éjszakai böngészős futás (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Gyors tesztek (böngésző nélkül)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Függőségek
        run: pip install -r requirements.txt
      - name: Tesztek (fast)
        run: python tests/run_all.py --fast

  deps:
    name: Függőség-audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit telepítése
        run: pip install pip-audit
      - name: Függőségek auditja
        run: pip-audit -r requirements.txt

  browser:
    name: Böngészős UI tesztek (Playwright — csak a felület teszteléséhez)
    # Csak main pushra, éjszakánként vagy kézi indításra — minden pushra túl drága.
    # Megjegyzés: a Playwright itt a dashboard UI-t hajtja; a KRÉTA-adatlekérés
    # a v2.5.0-tól kizárólag mobil API-ból fut (Kaneo #64).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Függőségek (böngészős)
        run: pip install -r requirements-playwright.txt
      - name: Playwright cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements-playwright.txt', 'requirements.txt') }}
      - name: Chromium telepítés
        run: python -m playwright install --with-deps chromium
      - name: Tesztek (browser)
        run: |
          set -o pipefail
          python -u tests/run_all.py --browser 2>&1 | tee browser-tests.log
      - name: Browser tesztnapló hibánál
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-log
          path: browser-tests.log
          if-no-files-found: ignore
      - name: Képernyőképek hibánál
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kreta-screenshots
          path: |
            ${{ runner.temp }}/kreta_*
            /tmp/kreta_*
          if-no-files-found: ignore

  live-smoke:
    name: Élő füstteszt (szerver)
    # Csak éjszakánként vagy kézi indításra; a KRETA_URL secret hiányában kimarad.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Füstteszt
        env:
          KRETA_URL: ${{ secrets.KRETA_URL }}
          KRETA_AUTH_USER: ${{ secrets.KRETA_AUTH_USER }}
          KRETA_AUTH_PASS: ${{ secrets.KRETA_AUTH_PASS }}
        run: |
          if [ -z "$KRETA_URL" ]; then
            echo "KRETA_URL secret nincs beállítva — élő füstteszt kihagyva."
            exit 0
          fi
          python tools/live_smoke.py --url "$KRETA_URL" --max-age-hours 26
