services:
  kreta-app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # A v2.5.0-tól egyetlen (API-s, böngésző nélküli) image van (Kaneo #64).
    image: kreta-app:runtime
    container_name: kreta-app
    # Belső hálózati port: 8085 (a RabbitApp_Svelte 8084-es portja mellett)
    ports:
      - "8085:5000"
    volumes:
      # A data kötet: DB, config.json, csatolmányok, sync.log
      # Publikus quick start: ./data ; a saját szerveren felülírható a DATA_DIR env-vel.
      - ${DATA_DIR:-./data}:/app/data
      # A mentési kötet: ide írja a cron mentő a pillanatfelvételeket
      - ${BACKUP_DIR:-./backup}:/app/backup
    # A .env NEM kötelező: a Docker Compose a projekt .env fájlját interpolációhoz
    # automatikusan betölti; az alábbi env-ek defaultdal is működnek.
    environment:
      - TZ=Europe/Budapest
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-PROD}
      # ntfy push (opcionális) — a .env-ből vagy a config.json NTFY blokkjából
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_NOTIFY_SUCCESS=${NTFY_NOTIFY_SUCCESS:-1}
      - NTFY_INCLUDE_NAMES=${NTFY_INCLUDE_NAMES:-0}
      # App-szintű beállítások — KIZÁRÓLAG konténerbeli, fix értékek!
      # (A .env-be SOHA ne kerüljön DATA_DIR / BACKUP_DIR / KRETA_DATA_DIR
      #  host-útvonal: az a RabbitApp 2026-10-27-i „üres db” incidensét okozta.
      #  A kötet-útvonalakat fent a compose-defaultok tartalmazzák.)
      - KRETA_HOST=0.0.0.0
      - KRETA_PORT=5000
      - KRETA_DEBUG=0
      # Élesben waitress (a Flask dev szerver csak fejlesztésre való)
      - KRETA_SERVER=waitress
      - KRETA_DATA_DIR=/app/data
      # Fontos: az alapérték "static/csatolmanyok" lenne, ami a konténer
      # RÉTEGÉBE írna (rebuildnél elvesznek a csatolmányok, és a mentő sem
      # éri el őket) — ezért explicit a data kötet alá irányítjuk.
      - KRETA_CSATOLMANYOK_DIR=/app/data/csatolmanyok
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Az adatbázis és a config.json a DATA_DIR-ben (alapból ./data), a mentések a
# BACKUP_DIR-ben (alapból ./backup). A .env opcionális; a saját szerveren a
# DATA_DIR/BACKUP_DIR env-ekkel lehet a köteteket máshova tenni.
# Soha ne töröld a data/ könyvtárat!
